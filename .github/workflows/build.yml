name: Build

# Every push, feature branch or main alike (#387) — this repo has no pull requests, so a direct push IS
# how a merge into main lands, and "on push" already covers both cases the issue asks for in one trigger.
# Except a push that touches nothing but the agent journal, the research folder (#588) or a release's
# screenshot: none of them is read by any build, and a journal-only merge used to cost the full run. GitHub
# does not evaluate path filters for a tag push, so a release tag still runs everything.
on:
  push:
    paths-ignore:
      - 'docs/agent-notes*.md'
      - 'Research/**'
      - 'Images/releases/**'

# Nothing here writes to the repository (#588) - the token only has to check the code out.
permissions:
  contents: read

# A newer push to the same branch makes the older run's answer worthless, so it is cancelled rather than left
# to finish (#588). Keyed on the ref, so two branches never cancel each other.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # The SDK band global.json names as its floor (#587): 10.0.2xx is the band the owner builds with, so CI
      # and the release install that band rather than the newest 10.0 one. global.json's rollForward is
      # latestFeature, so a newer band the image already carries would still win - the pin is on what is
      # installed here, not a refusal of anything newer.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.2xx'

      # The NuGet packages, keyed on every project file and tool manifest (#588): a push that changes no
      # package reference restores from the cache instead of the feed. This saves the restore and nothing
      # more. The shader compile, which dominates a cold build, happens once per run since #618: the effects
      # compile in Prazsky.Shaders, whose intermediates every later solution build (Release included) reuses.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', '**/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Each project with a content build carries its own manifest, and the content build shells out to
      # `dotnet mgcb` with the manifest search walking up from the *project* directory — so this has to run
      # once per such project, not once at the repo root (CLAUDE.md's own build section explains why).
      - name: Restore content tools (Prazsky.Shaders)
        run: dotnet tool restore
        working-directory: BS3DLibs/Prazsky.Shaders

      - name: Restore content tools (Testbed)
        run: dotnet tool restore
        working-directory: Testbed

      - name: Restore content tools (MapEditor)
        run: dotnet tool restore
        working-directory: MapEditor

      - name: Restore content tools (Game)
        run: dotnet tool restore
        working-directory: Game

      - name: Build BS3DLibs.sln
        run: dotnet build BS3DLibs.sln

      - name: Build Testbed.sln
        run: dotnet build Testbed.sln

      - name: Build MapEditor.sln
        run: dotnet build MapEditor.sln

      - name: Build Game.sln
        run: dotnet build Game.sln

      # The configuration players get (#588): release.yml publishes Release, and #if DEBUG blocks exist
      # (BallsMap, the Testbed), so a Release-only break was otherwise found only at tag time. Game.sln alone,
      # because it is the one that ships (and carries the libraries and the tools); the Testbed and the
      # MapEditor are never released and a second shader compile of each would buy nothing.
      - name: Build Game.sln (Release)
        run: dotnet build Game.sln -c Release

      # The generator is deterministic, so regenerating and demanding a clean tree proves the levels shipped
      # on disk are the ones the generator in the tree actually makes — a design can otherwise be edited and
      # the regeneration forgotten, and nothing today notices. Reads and rewrites the working tree; never
      # committed, never pushed.
      # `git diff` alone ignores untracked files (#588): a new design whose Levels.json was committed but
      # whose level file was never `git add`-ed regenerated here as an untracked file and passed, leaving
      # main without a level its set names, so the untracked files are listed as well - by `git ls-files
      # --others` and NOT `git status --porcelain`, which reports every regenerated file as modified here
      # because the generator writes CRLF over the LF checkout (`git diff` normalizes that). Every exit code is
      # checked explicitly, because pwsh fails a step only on the LAST native command's exit code.
      - name: Regenerate levels and check they match what is committed
        run: |
          dotnet run --project Tools/LevelGen/LevelGen.csproj
          if ($LASTEXITCODE -ne 0) { throw "LevelGen failed (exit $LASTEXITCODE)" }
          git diff --exit-code Game/Levels
          if ($LASTEXITCODE -ne 0) { throw "The regenerated levels differ from what is committed" }
          $stray = git ls-files --others -- Game/Levels
          if ($stray) { $stray; throw "The generator wrote level file(s) that were never committed" }

      - name: Run ScoreSim
        run: dotnet run --project Tools/ScoreSim/ScoreSim.csproj

      # The logic tests (#586): the invariants the libraries state "by construction" - the neighbour rule, one
      # constraint per pair, the legacy padding's parity, the level round-trip, the save outcomes, the atomic
      # write, the scoring mechanics and the top-level ceiling anchor of #561. Game.sln above built the project;
      # --no-build keeps a failure here the tests' own. See "The logic tests" in docs/formats-and-tools.md.
      - name: Run the logic tests
        run: dotnet test Tests/BS3D.Tests/BS3D.Tests.csproj --no-build

      # BestPractices.md section 10: a check's answer is evidence only once its failing branch has been seen
      # to fire. These three were demonstrations run by hand (#588); here they fire on every push, a few
      # seconds each. --no-build: Game.sln above built both tools, so a nonzero exit is the tool's own.
      # ScoreSim with every ceiling scaled to a quarter must refuse (exit 1, and say OVER CEILING).
      - name: Self-check - the ScoreSim ceiling gate fires
        run: |
          $out = dotnet run --project Tools/ScoreSim/ScoreSim.csproj --no-build -- --ceiling-scale 0.25 | Out-String
          $code = $LASTEXITCODE
          $out
          if ($code -ne 1 -or $out -notmatch 'OVER CEILING') { throw "ScoreSim --ceiling-scale 0.25 exited $code; the ceiling gate did not fire" }
          exit 0

      # WindingCheck's self-test feeds it a box flipped on purpose and exits 1 unless both judgements fire.
      # It asks DirectX for WARP, the software rasteriser every Windows install carries, so the runner's
      # missing GPU does not matter.
      - name: Self-check - WindingCheck catches a flipped mesh
        run: |
          dotnet run --project Tools/WindingCheck/WindingCheck.csproj --no-build -- --selftest
          if ($LASTEXITCODE -ne 0) { throw "WindingCheck --selftest failed (exit $LASTEXITCODE)" }

      # The hook that refuses git clean / reset --hard, exercised in both directions (Git Bash on the runner).
      - name: Self-check - the destructive-git guard
        shell: bash
        run: bash .claude/hooks/guard-destructive-git.test.sh

      # The path guard the skill scripts share (#657), in both directions. A Windows path whose backslashes bash
      # ate arrives as C:foo - a drive-relative path every cmdlet accepts, which New-Item made into a folder in the
      # repository's root; the first case is that string verbatim.
      - name: Self-check - the skill scripts' path guard
        run: |
          ./Tools/PathGuard.test.ps1
          if ($LASTEXITCODE -ne 0) { throw "PathGuard.test.ps1 failed (exit $LASTEXITCODE)" }

      # The lattice probe's own test (#674): synthetic star fields of known answer - a Poisson field it must not flag, a
      # jittered lattice it must, a designed facade it must call a lattice and not an edge, a quantised gradient and a
      # horizon it must refuse. Exit 3 unless every asserted case holds. About half a minute in Debug.
      - name: Self-check - the lattice probe finds a lattice and refuses an edge
        run: |
          dotnet run --project Tools/LatticeProbe/LatticeProbe.csproj --no-build -- --selftest
          if ($LASTEXITCODE -ne 0) { throw "LatticeProbe --selftest failed (exit $LASTEXITCODE)" }

  # GamePi (#786, #787): the Game's own sources built for Linux ARM64 on MonoGame DesktopGL, on the platform it runs
  # on, beside the Windows job rather than after it. It is how a change to Game/ that breaks the Raspberry Pi build is
  # caught on the push that made it: WinForms in a shared file fails the compile, and any other Windows-only .NET API
  # is CA1416, which GamePi.csproj makes an error. A DllImport into user32 passes both and is not caught here (see
  # "GamePi" in docs/build-and-release.md). The ARM64 runner is free on a public repository, as the Windows one is.
  gamepi:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.2xx'

      # Its own key: the Windows job's cache holds win-x64 runtime packs and a Windows mgcb, none of which this reads
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', '**/.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      # GamePi pins the official dotnet-mgcb 3.8.5: the bad-echo-mgcb the Windows projects pin imports textures
      # through FreeImage, which has no ARM64 build
      - name: Restore content tools (GamePi)
        run: dotnet tool restore
        working-directory: GamePi

      - name: Build GamePi.sln
        run: dotnet build GamePi.sln

      - name: Build GamePi.sln (Release)
        run: dotnet build GamePi.sln -c Release

      # The logic tests once more, on ARM64: what they check is the same code, but Bepu's wide types are four lanes
      # here (NEON) and eight on the Windows runner (AVX2)
      - name: Run the logic tests (linux-arm64)
        run: dotnet test Tests/BS3D.Tests/BS3D.Tests.csproj

      # The folder a Pi player would run, self-contained, and the files without which it cannot start: the apphost
      # (executable - a lost mode bit is a "Permission denied" nobody can explain), the SDL and OpenAL natives the
      # DesktopGL package carries for linux-arm64, the two content assets and the level set. No shaders: GamePi has
      # none until #789.
      - name: Publish GamePi (linux-arm64, self-contained) and check the folder
        run: |
          dotnet publish GamePi/GamePi.csproj -c Release -r linux-arm64 --self-contained -o publish
          for f in BS3D libSDL2-2.0.so.0 libopenal.so Content/Images/Logo.xnb Content/Fonts/segoeui.xnb Levels/Levels.json; do
            test -e "publish/$f" || { echo "The published folder has no $f"; exit 1; }
          done
          test -x publish/BS3D || { echo "publish/BS3D is not executable"; exit 1; }

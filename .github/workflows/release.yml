name: Release

# A build a player can actually run (#453). Deliberately a second workflow rather than another job in
# build.yml: an ordinary push has to stay as cheap as it is, and a release is not something every commit
# should produce.
#
# Two ways in, and only one of them publishes anything:
#   * pushing a tag "v*" — builds, zips and publishes a GitHub Release with the zip attached;
#   * the "Run workflow" button — the same build, the zip left as a workflow artifact and NO release
#     created, so the whole pipeline can be rehearsed without anything becoming public.
#
# build.yml fires for a tag push as well, but only BESIDE this workflow: nothing waited for it, so a tag on a
# commit whose gate failed published anyway. Since #588 build.yml's gates run here too, ahead of the publish -
# the level generator's regeneration check first, the music's (MusicBake --shipped, #919) after it, ScoreSim
# with the score ceiling table it writes beside the zip (#549) later - and a failure in any stops the job before
# anything is released.
#
# Four jobs (three since #793, the Android one since #1053), one tag and one score-ceilings table for all of them:
#   * release - the Windows zip and the ceilings, behind the three gates (and the check that GamePi's committed GL
#     effects are what their sources compile to, since the Raspberry Pi package ships them);
#   * release-linux-arm64 - GamePi (the Game on Linux ARM64, a Raspberry Pi 5) published self-contained on a native
#     ARM64 runner and packed as a tar.gz, because only a tar keeps the executable bit;
#   * release-android - GameAndroid (the Game on Android phones, OpenGL ES) as one arm64 APK, signed with the
#     owner's key when its secrets are set; with none, a manual run signs a rehearsal with a key made on the spot
#     and a tag makes no APK at all (the job's own header has the three cases);
#   * publish - waits for all three, writes ONE SHA256SUMS over everything and, on a tag, creates the release. Any
#     package failing stops it, so a tag publishes all of them or nothing. A manual run ends here without a release
#     and leaves SHA256SUMS beside the packages as artifacts.
#
# It costs nothing: this repository is public, and GitHub bills neither standard-runner minutes nor
# release storage and bandwidth for public repositories. (Windows minutes are billed at twice the Linux
# rate on private ones, which is the only reason that sentence is worth writing down.)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# The workflow token is read-only by default and creating a release has to write. Nothing else here does.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # The SDK band global.json names as its floor (#587): 10.0.2xx is the band the owner builds with, so CI
      # and the release install that band rather than the newest 10.0 one. global.json's rollForward is
      # latestFeature, so a newer band the image already carries would still win - the pin is on what is
      # installed here, not a refusal of anything newer.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.2xx'

      # The content build shells out to `dotnet mgcb` with the manifest search walking up from the *project*
      # directory, so this runs in Game/ (CLAUDE.md's build section explains why each executable carries its
      # own manifest). Only the Game ships, so only its manifest - and the shader library's, below - is restored.
      - name: Restore content tools (Game)
        run: dotnet tool restore
        working-directory: Game

      # The shaders compile in Prazsky.Shaders (#618), which carries its own manifest for the same reason, and
      # reach the published folder as that library's content items.
      - name: Restore content tools (Prazsky.Shaders)
        run: dotnet tool restore
        working-directory: BS3DLibs/Prazsky.Shaders

      # The same gate as build.yml's (#588), run here so a release cannot come out of a commit whose shipped
      # levels are not the ones the generator in the tree makes - or whose new level was never committed at
      # all, which `git diff` alone does not see (build.yml says why `ls-files --others` and not `status`).
      # Every exit code is checked: pwsh fails a step only on the last one's. Levels.json is emptied first, the
      # canary build.yml explains: a generator that wrote nothing cannot pass by leaving the committed files alone.
      - name: Gate - regenerate levels and check they match what is committed
        shell: pwsh
        run: |
          Set-Content -Path Game/Levels/Levels.json -Value '{}' -NoNewline
          dotnet run --project Tools/LevelGen/LevelGen.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "LevelGen failed (exit $LASTEXITCODE)" }
          git diff --exit-code Game/Levels
          if ($LASTEXITCODE -ne 0) { throw "The regenerated levels differ from what is committed" }
          $stray = git ls-files --others -- Game/Levels
          if ($stray) { $stray; throw "The generator wrote level file(s) that were never committed" }
          # Same content, but the generator writes the platform's line ending; the zip ships the files exactly
          # as committed.
          git checkout -- Game/Levels

      # GamePi's OpenGL effects are compiled on Windows and COMMITTED (#789): the Pi cannot compile them, so the
      # Linux package below ships whatever is in GamePi/Shaders/Compiled. gamepi-shaders.yml checks that on every
      # push that touches them, but a release must not lean on a push-time check it did not wait for - this is
      # the same check, here, so a tag on a commit whose compiled effects went stale publishes nothing. A changed
      # file and a never-committed one alike (the level gate's lesson: `git diff` alone does not see untracked).
      - name: Gate - GamePi's committed GL effects are what their sources compile to
        shell: pwsh
        run: |
          ./GamePi/Shaders/compile.ps1
          git diff --stat --exit-code -- GamePi/Shaders/Compiled
          if ($LASTEXITCODE -ne 0) { throw "GamePi/Shaders/Compiled differs from what the sources compile to: run GamePi/Shaders/fetch.sh (or compile.ps1 on Windows) and commit it" }
          $stray = git ls-files --others --exclude-standard -- GamePi/Shaders/Compiled
          if ($stray) { $stray; throw "The sources compile to effect(s) that were never committed" }

      # build.yml's music gate (#919), here for the same reason as the level gate: the zip ships Game/Music as
      # committed, and a recording whose post-codec peak the game's decode headroom cannot absorb, or that falls
      # silent too long (#772), must not reach a player because nothing waited for the push-time check. It decodes
      # the committed .ogg files in process and needs nothing else.
      - name: Gate - the shipped music decodes within its headroom
        shell: pwsh
        run: |
          dotnet run --project Tools/MusicBake/MusicBake.csproj -c Release -- --shipped
          if ($LASTEXITCODE -ne 0) { throw "MusicBake refused a shipped recording (exit $LASTEXITCODE)" }

      # One step decides what this build is called and every step after it reads the answer out of the
      # environment rather than deriving it again. A tag names itself; a manual run is "dev-<short sha>",
      # which can never be mistaken for a release and says what it is at a glance.
      - name: Name this build
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'dev-' + '${{ github.sha }}'.Substring(0, 7) }
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_VERSION=$version" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_NAME=BS3D-$version-win-x64" -Encoding utf8

      # Self-contained: the .NET runtime travels inside the exe, which is the whole promise of the download —
      # the player installs nothing. Deliberately NOT trimmed: Myra, FontStashSharp and the content pipeline
      # all reach for types by reflection. But a SINGLE FILE since #714: untrimmed, bundling removes no type,
      # and the folder a player opens after extracting is BS3D.exe and the four folders the game reads at run
      # time (Content, Levels, Music, Sfx) instead of 299 files with the right exe somewhere among them. No
      # native library needs self-extraction (everything is managed or a system DLL), and the stale 2.1 runtime
      # pack MonoGame still declares is kept out of the publish by Game.csproj's own target.
      #
      # DebugType=embedded keeps what the .pdb files were kept for - turning a player's crash report into a
      # stack trace with line numbers - without a .pdb beside the exe: measured on a throwaway single-file app,
      # a trace carries its file and line either way, and the debug info now travels inside the assemblies.
      # Passed here on the command line, not set in a project, so it reaches the three libraries as well.
      - name: Publish the game (self-contained, single file, win-x64)
        shell: pwsh
        run: |
          $publishArgs = @('publish', 'Game/Game.csproj', '-c', 'Release', '-r', 'win-x64', '--self-contained', 'true',
            '-p:PublishSingleFile=true', '-p:DebugType=embedded', '-o', "publish/$env:BUILD_NAME")
          # A plain numeric tag ("v1.2.3") also stamps the assembly, so the exe's own version matches the
          # release it came out of; anything else (a suffixed tag, a manual run) leaves the default alone.
          if ($env:BUILD_VERSION -match '^v(\d+(\.\d+){1,3})$') { $publishArgs += "-p:Version=$($Matches[1])" }
          # And names the release to the game itself (#546), suffixed tags included: the online client submits
          # to the built-in score service only from a build that says it is a release, so a rehearsal zip - a
          # manual run's "dev-<sha>" - and every local build never land on the public boards.
          if ('${{ github.ref_type }}' -eq 'tag') { $publishArgs += "-p:BS3DReleaseVersion=$env:BUILD_VERSION" }
          dotnet @publishArgs

      # A published folder missing its content is still a folder of files, and that failure would show up on a
      # player's machine rather than here. These are what a playable, install-nothing build cannot be without:
      # the exe with the runtime inside it, the compiled shaders, the levels, the music and the sounds. The
      # shaders are the one of them the Game does not build itself: they are Prazsky.Shaders' content items
      # (#618), copied in through the project reference, so this is also the check that the copy really
      # reaches a publish.
      #
      # And the way in (#714): the top level is BS3D.exe and the four folders, nothing else. The runtime check
      # is the exe's size, since a single-file self-contained exe carries it (116 MB; a framework-dependent or
      # unbundled one is a few hundred KB), and a stray item at the top - a DLL, a second exe, a folder of
      # translations - is exactly the wall of files this layout exists to remove, so it fails the build.
      - name: Check the published folder is playable
        shell: pwsh
        run: |
          $root = "publish/$env:BUILD_NAME"
          $missing = @()
          if (-not (Test-Path "$root/BS3D.exe")) { $missing += 'BS3D.exe' }
          elseif ((Get-Item "$root/BS3D.exe").Length -lt 50MB) { $missing += 'the .NET runtime inside BS3D.exe - is this really a self-contained single-file publish?' }
          $stray = @(Get-ChildItem $root | Where-Object { $_.Name -notin 'BS3D.exe', 'Content', 'Levels', 'Music', 'Sfx' } | ForEach-Object Name)
          if ($stray.Count -gt 0) { $missing += "nothing else at the top level, but found: $($stray -join ', ')" }
          if (-not (Test-Path "$root/Content/Shaders/InstancedModel.xnb")) { $missing += 'the compiled shaders' }
          # The Potato tier's effects for a run started with "potato" (#808): a second set, in a folder of its own
          if (-not (Test-Path "$root/Content/Potato/Shaders/PotatoModel.xnb")) { $missing += "the Potato tier's effects (Content/Potato/Shaders)" }
          if (-not (Get-ChildItem "$root/Levels" -Filter *.json -ErrorAction SilentlyContinue)) { $missing += 'the levels' }
          if (-not (Get-ChildItem "$root/Music" -Filter *.ogg -ErrorAction SilentlyContinue)) { $missing += 'the music' }
          if (-not (Get-ChildItem "$root/Sfx" -Filter *.ogg -ErrorAction SilentlyContinue)) { $missing += 'the sound effects' }
          if ($missing.Count -gt 0) { throw "The published folder is missing: $($missing -join '; ')" }
          $files = Get-ChildItem $root -Recurse -File
          "{0} published {1:N0} file(s), {2:N0} MB" -f $env:BUILD_NAME, $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)

      # Compress-Archive on a *directory* keeps that directory inside the archive, which is the point:
      # extracting drops one BS3D-... folder rather than spraying its contents into Downloads.
      - name: Zip the published folder
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/$env:BUILD_NAME" -DestinationPath "$env:BUILD_NAME.zip" -CompressionLevel Optimal
          "{0:N1} MB zipped" -f ((Get-Item "$env:BUILD_NAME.zip").Length / 1MB)

      # The online boards' ceiling table (#549): every shipped level's board key and the score the service
      # refuses a submission over, for exactly the levels in this zip. It travels with the release rather than
      # with the service because old zips stay in the wild for ever: the service loads every release's table,
      # so each game version's boards stay valid. ScoreSim is also build.yml's gate, so a set that rates wrongly
      # fails here as well - which only means a release cannot ship a table the gate has refused.
      - name: Write the score ceilings
        shell: pwsh
        run: |
          dotnet run --project Tools/ScoreSim/ScoreSim.csproj -c Release -- --ceilings "BS3D-$env:BUILD_VERSION-ceilings.json"
          if ($LASTEXITCODE -ne 0) { throw "ScoreSim refused the level set" }

      # Every run keeps the zip, tagged or not, and this is what makes the manual run worth having: the
      # pipeline can be rehearsed, downloaded and played without anything being published to anyone. The checksums
      # are written by the publish job, over every package at once (#793).
      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_NAME }}
          path: |
            ${{ env.BUILD_NAME }}.zip
            BS3D-${{ env.BUILD_VERSION }}-ceilings.json
          retention-days: 90

  # The Raspberry Pi package (#793): GamePi, the Game's own sources on MonoGame DesktopGL for Linux ARM64, published
  # self-contained so the Pi installs nothing. Built on a NATIVE ARM64 runner (the one build.yml's gamepi job already
  # publishes on, #787) rather than cross-published from Windows, so the folder is made by the platform it runs on and
  # keeps its executable bit, and packed as a tar.gz because only a tar remembers one (Compress-Archive on Windows
  # loses it). It ships the GL effects committed in GamePi/Shaders/Compiled; the Windows job above refuses a tag on a
  # commit where those are stale. Same tag, same BS3DReleaseVersion as the Windows build (the ARM64 mark is display
  # only, BuildVersion.DisplayName), so the same ceilings table whitelists its scores.
  release-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.2xx'

      # GamePi pins the official dotnet-mgcb 3.8.5: the bad-echo-mgcb the Windows projects pin imports textures
      # through FreeImage, which has no ARM64 build
      - name: Restore content tools (GamePi)
        run: dotnet tool restore
        working-directory: GamePi

      # The same naming rule as the Windows job: a tag names itself, a manual run is "dev-<short sha>"
      - name: Name this build
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then version="${{ github.ref_name }}"; else version="dev-${GITHUB_SHA::7}"; fi
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NAME=BS3D-$version-linux-arm64" >> "$GITHUB_ENV"

      # Self-contained, not trimmed (Myra, FontStashSharp and the content pipeline reflect), the debug info embedded so
      # a crash report still names file and line - the Windows publish's reasons, and its version rules: a plain
      # numeric tag stamps the assembly, and any tag names the release to the game (#546), so a rehearsal's
      # "dev-<sha>" and every local build never land on the public boards. NOT a single file, unlike the Windows
      # one: the SDL2 and OpenAL natives and the runtime sit beside the executable, a layout the Pi has been
      # measured to run from (#785); a single-file Linux layout is a separate experiment.
      - name: Publish GamePi (self-contained, linux-arm64)
        run: |
          args=(publish GamePi/GamePi.csproj -c Release -r linux-arm64 --self-contained true -p:DebugType=embedded -o "publish/$BUILD_NAME")
          if [[ "$BUILD_VERSION" =~ ^v([0-9]+(\.[0-9]+){1,3})$ ]]; then args+=("-p:Version=${BASH_REMATCH[1]}"); fi
          if [ "${{ github.ref_type }}" = "tag" ]; then args+=("-p:BS3DReleaseVersion=$BUILD_VERSION"); fi
          dotnet "${args[@]}"

      # What a Pi player cannot start without: the executable apphost (a lost mode bit is a "Permission denied" nobody
      # can explain), the runtime beside it, the SDL and OpenAL natives the DesktopGL package carries for
      # linux-arm64, GamePi's own compiled GL effects (the Potato path loads PotatoModel at its first frame), the two
      # content assets, the levels, the music and the sounds.
      - name: Check the published folder is playable
        run: |
          root="publish/$BUILD_NAME"
          missing=()
          for f in BS3D libcoreclr.so libSDL2-2.0.so.0 libopenal.so Content/Images/Logo.xnb Content/Fonts/segoeui.xnb \
                   Content/Shaders/PotatoModel.xnb Content/Shaders/PotatoSky.xnb Levels/Levels.json; do
            [ -e "$root/$f" ] || missing+=("$f")
          done
          [ -x "$root/BS3D" ] || missing+=("BS3D executable (mode bit)")
          ls "$root"/Music/*.ogg > /dev/null 2>&1 || missing+=("the music")
          ls "$root"/Sfx/*.ogg > /dev/null 2>&1 || missing+=("the sound effects")
          if [ ${#missing[@]} -gt 0 ]; then echo "The published folder is missing: ${missing[*]}"; exit 1; fi
          echo "$BUILD_NAME published $(find "$root" -type f | wc -l) file(s), $(du -sm "$root" | cut -f1) MB"

      # One top-level folder, so extracting drops BS3D-...-linux-arm64/ rather than spraying its contents into the
      # current directory. The listing check is what proves the executable bit made it INTO the archive.
      - name: Pack the published folder
        run: |
          tar -czf "$BUILD_NAME.tar.gz" -C publish "$BUILD_NAME"
          # Into a variable, not a pipe into `grep -q`: the runner's shell is `-o pipefail`, and a grep that quits on its
          # first match can break the pipe behind it
          listing="$(tar -tvzf "$BUILD_NAME.tar.gz" "$BUILD_NAME/BS3D")"
          echo "$listing"
          [[ "$listing" == -rwx* ]] || { echo "BS3D lost its executable bit in the archive"; exit 1; }
          echo "$(du -m "$BUILD_NAME.tar.gz" | cut -f1) MB packed"

      - name: Keep the package as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_NAME }}
          path: ${{ env.BUILD_NAME }}.tar.gz
          retention-days: 90
          # Already compressed (a tar.gz of ogg): a second pass would cost time and save nothing
          compression-level: 0

  # The Android package (#1053): GameAndroid, the Game's own sources on OpenGL ES, as one arm64 APK a phone installs
  # from its downloads. Built on Windows, as build.yml's gameandroid job builds it (MojoShader's compile of the effects
  # needs it), with the same version rules as the two packages above, so the same ceilings table whitelists its scores
  # (the Android mark is display only, BuildVersion.DisplayName).
  #
  # WHO SIGNS IT decides what this job makes, and an Android app's signature is its identity: a phone refuses an
  # update signed with another key, so the key is the owner's, made once (Tools/android-signing-key.cmd) and never
  # changed. It reaches this job as two secrets, ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD, and its
  # certificate's SHA-256 is committed in GameAndroid/release-certificate.sha256:
  #   * the secrets are set - the APK is signed with the owner's key and its certificate must be the committed one,
  #     so a key that was replaced fails here instead of reaching a player who can then never update;
  #   * no secrets, a manual run - a rehearsal: the APK is signed with a key made on the spot and kept as an
  #     artifact like the other two packages, so the whole job can be tried before the owner's key exists;
  #   * no secrets, a tag - no Android package: the release carries the Windows zip and the Pi tarball as it always
  #     did, and the log says so. Once the certificate is committed that is a failure instead: a release that used
  #     to carry the APK must not quietly lose it.
  release-android:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.2xx'

      # The JDK the Android build tools run on: 17, the one the owner builds with
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Restore content tools (GameAndroid)
        run: dotnet tool restore
        working-directory: GameAndroid

      - name: Install the Android SDK parts the build asks for
        run: |
          dotnet build GameAndroid/GameAndroid.csproj -t:InstallAndroidDependencies "-p:AndroidSdkDirectory=$env:ANDROID_HOME" "-p:JavaSdkDirectory=$env:JAVA_HOME" -p:AcceptAndroidSDKLicenses=True
          if ($LASTEXITCODE -ne 0) { throw "InstallAndroidDependencies failed (exit $LASTEXITCODE)" }

      # The same naming rule as the other two jobs: a tag names itself, a manual run is "dev-<short sha>"
      - name: Name this build
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'dev-' + '${{ github.sha }}'.Substring(0, 7) }
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_VERSION=$version" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_NAME=BS3D-$version-android-arm64" -Encoding utf8

      # The three cases of the job's header. The key file never touches the workspace: it is written under the
      # runner's temp folder, which is gone with the runner.
      - name: Decide who signs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $pinned = Test-Path 'GameAndroid/release-certificate.sha256'
          $tag = '${{ github.ref_type }}' -eq 'tag'
          $store = Join-Path $env:RUNNER_TEMP 'bs3d-signing.keystore'
          if ($env:ANDROID_KEYSTORE_BASE64) {
            [System.IO.File]::WriteAllBytes($store, [System.Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            $signing = 'owner'
          }
          elseif ($tag) {
            if ($pinned) { throw "GameAndroid/release-certificate.sha256 is committed, so releases carry an Android package, but the ANDROID_KEYSTORE_BASE64 secret is not set: this tag publishes nothing" }
            Write-Host "::notice::No Android signing key is set (Tools/android-signing-key.cmd makes one), so this release carries no Android package."
            $signing = 'none'
          }
          else {
            & "$env:JAVA_HOME/bin/keytool" -genkeypair -keystore $store -storetype PKCS12 -alias bs3d -keyalg RSA -keysize 2048 -validity 30 -storepass rehearsal -dname 'CN=BS3D rehearsal'
            if ($LASTEXITCODE -ne 0) { throw "keytool could not make the rehearsal key (exit $LASTEXITCODE)" }
            $signing = 'rehearsal'
          }
          "Signing: $signing"
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNING=$signing" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "SIGNING_KEYSTORE=$store" -Encoding utf8

      # The version a phone reads is not the assembly's: versionName is what its settings show and versionCode an
      # integer every update must not go under, so a plain numeric tag sets both - v0.5.1 is 0.5.1 and 5001
      # (major x 1 000 000 + minor x 1000 + patch), and a suffixed tag keeps its numbers' code. The passwords reach
      # the build as "env:" names, never as text on a command line the log prints.
      - name: Build the APK (Release, android-arm64, signed)
        if: env.SIGNING != 'none'
        env:
          SIGNING_PASSWORD: ${{ env.SIGNING == 'owner' && secrets.ANDROID_KEYSTORE_PASSWORD || 'rehearsal' }}
        run: |
          $buildArgs = @('build', 'GameAndroid/GameAndroid.csproj', '-c', 'Release', '-p:RuntimeIdentifier=android-arm64',
            "-p:AndroidSdkDirectory=$env:ANDROID_HOME", "-p:JavaSdkDirectory=$env:JAVA_HOME", '-p:DebugType=embedded',
            '-p:AndroidKeyStore=true', "-p:AndroidSigningKeyStore=$env:SIGNING_KEYSTORE", '-p:AndroidSigningKeyAlias=bs3d',
            '-p:AndroidSigningStorePass=env:SIGNING_PASSWORD', '-p:AndroidSigningKeyPass=env:SIGNING_PASSWORD')
          if ($env:BUILD_VERSION -match '^v(\d+)\.(\d+)(?:\.(\d+))?(?:\.\d+)?(-.*)?$') {
            $code = [int]$Matches[1] * 1000000 + [int]$Matches[2] * 1000 + [int]("0" + $Matches[3])
            $buildArgs += "-p:ApplicationVersion=$code"
            $buildArgs += "-p:ApplicationDisplayVersion=$($env:BUILD_VERSION.Substring(1))"
          }
          if ($env:BUILD_VERSION -match '^v(\d+(\.\d+){1,3})$') { $buildArgs += "-p:Version=$($Matches[1])" }
          if ('${{ github.ref_type }}' -eq 'tag') { $buildArgs += "-p:BS3DReleaseVersion=$env:BUILD_VERSION" }
          dotnet @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "GameAndroid failed to build (exit $LASTEXITCODE)" }

      # What a phone cannot start the game without (build.yml's list: the runtime, OpenAL, the content, every effect
      # compiled for OpenGL ES, the level set), then the signature itself, read back off the APK by the SDK's own
      # verifier: the owner's key must be the one whose certificate is committed.
      - name: Check the APK and who signed it
        if: env.SIGNING != 'none'
        run: |
          $apk = 'GameAndroid/bin/Release/net10.0-android/android-arm64/io.github.antoninprazsky.bs3d-Signed.apk'
          if (-not (Test-Path $apk)) { throw "The build wrote no $apk" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $apk).Path)
          $names = @($zip.Entries | ForEach-Object { $_.FullName })
          $zip.Dispose()
          foreach ($f in 'lib/arm64-v8a/libcoreclr.so', 'lib/arm64-v8a/libopenal.so', 'assets/Content/Images/Logo.xnb',
                         'assets/Content/Fonts/segoeui.xnb', 'assets/Levels/Levels.json') {
            if ($names -notcontains $f) { throw "The APK has no $f" }
          }
          $effects = @(Get-ChildItem BS3DLibs/Prazsky.Shaders/Content/Shaders/*.fx | ForEach-Object { "assets/Content/Shaders/$($_.BaseName).xnb" }) +
                     @(Get-ChildItem GamePi/Shaders/*.fx | ForEach-Object { "assets/Content/Potato/Shaders/$($_.BaseName).xnb" })
          $missing = @($effects | Where-Object { $names -notcontains $_ })
          if ($missing.Count -gt 0) { throw "The APK lacks effects: $($missing -join ', ')" }
          if (-not ($names | Where-Object { $_ -like 'assets/Music/*.ogg' })) { throw "The APK has no music" }
          if (-not ($names | Where-Object { $_ -like 'assets/Sfx/*.ogg' })) { throw "The APK has no sound effects" }

          $apksigner = Get-ChildItem "$env:ANDROID_HOME/build-tools/*/apksigner.bat" | Sort-Object { [version]$_.Directory.Name } | Select-Object -Last 1
          if (-not $apksigner) { throw "No apksigner under $env:ANDROID_HOME/build-tools" }
          $report = & $apksigner.FullName verify --print-certs $apk
          if ($LASTEXITCODE -ne 0) { $report; throw "apksigner refused the APK's signature (exit $LASTEXITCODE)" }
          # "Signer #1 certificate SHA-256 digest: ..." from one apksigner and "V3.0 Signer: certificate SHA-256
          # digest: ..." from another, one line per signature scheme: every one of them must name the same certificate
          $digests = @($report | Select-String 'certificate SHA-256 digest: ([0-9a-f]{64})' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique)
          if ($digests.Count -ne 1) { $report; throw "apksigner named $($digests.Count) certificates where one signs the APK" }
          $digest = $digests[0]
          "Signed by $digest ($env:SIGNING)"

          $pinnedPath = 'GameAndroid/release-certificate.sha256'
          if ($env:SIGNING -eq 'owner') {
            if (Test-Path $pinnedPath) {
              $pinned = (Get-Content -Raw $pinnedPath).Trim().ToLowerInvariant()
              if ($digest -ne $pinned) { throw "The APK is signed by $digest, and $pinnedPath says ${pinned}: a phone with the game installed would refuse this update. The key must never change." }
            }
            elseif ('${{ github.ref_type }}' -eq 'tag') { throw "The signing key is set but $pinnedPath is not committed: commit the line '$digest' there first, so a changed key can never go unnoticed" }
            else { Write-Host "::notice::$pinnedPath is not committed yet; this key's line is $digest" }
          }

          Copy-Item $apk "$env:BUILD_NAME.apk"
          "{0}.apk: {1:N1} MB, {2:N0} entries" -f $env:BUILD_NAME, ((Get-Item "$env:BUILD_NAME.apk").Length / 1MB), $names.Count

      - name: Keep the APK as a workflow artifact
        if: env.SIGNING != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_NAME }}
          path: ${{ env.BUILD_NAME }}.apk
          retention-days: 90
          # An APK is a zip of ogg and compressed natives: a second pass would cost time and save nothing
          compression-level: 0

  # Waits for every package, writes the one SHA256SUMS over everything and - on a tag only - publishes (#793). Any
  # job failing stops this one, so a tag publishes all its packages or nothing. The notes open with a picture of this
  # version when one was committed, then lead with what the download needs and what Windows will say about it,
  # because an unsigned exe surprises people; GitHub's generated list of what changed since the previous tag is
  # appended underneath by --generate-notes.
  #
  # The picture is Images/releases/<tag>.jpg (or .png), committed BEFORE the tag is pushed: a screenshot of
  # the game the tag ships, from `Tools/release-screenshot.ps1`, whose corner names the version. It is
  # linked at the tag's own ref rather than at main, so the release keeps showing the build it describes
  # however the file changes later. Optional on purpose - a tag without one publishes anyway and says so in
  # the log, since a missing picture is no reason to hold a download back.
  #
  # And Images/releases/<tag>.md, when one was committed with the picture, goes between the picture and the
  # download text: what this release says before anything else (v0.3.0's "the first release with online scores,
  # and how to turn them on" had to be in the notes from their first minute, not edited in after them).
  # Optional the same way. Keep it SHORT (#927): GitHub lists the assets beneath the whole body, so the body's
  # length is the scroll to the download - about a dozen one-line bullets of what changes play and one closing
  # line, the rule in "The workflows and the release" in docs/build-and-release.md.
  publish:
    needs: [release, release-linux-arm64, release-android]
    runs-on: ubuntu-latest

    steps:
      # For Images/releases/, the website's data the notes quote and the Android certificate's pin, nothing else
      - uses: actions/checkout@v7

      - name: Name this build
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'dev-' + '${{ github.sha }}'.Substring(0, 7) }
          Add-Content -Path $env:GITHUB_ENV -Value "BUILD_VERSION=$version" -Encoding utf8

      # Every package and the ceilings table, side by side in dist/: each package job named its artifact BS3D-<...>
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: BS3D-*
          path: dist
          merge-multiple: true

      # A checksum for every file the release carries (#588), in the format `sha256sum -c` reads, so a download can
      # be checked against what the release actually published. Names are bare, so it is checked from the folder the
      # files were downloaded into.
      - name: Write SHA256SUMS
        shell: pwsh
        run: |
          $files = @("BS3D-$env:BUILD_VERSION-win-x64.zip", "BS3D-$env:BUILD_VERSION-linux-arm64.tar.gz", "BS3D-$env:BUILD_VERSION-ceilings.json")
          foreach ($f in $files) { if (-not (Test-Path "dist/$f")) { throw "dist/$f was not produced" } }
          # The Android package (#1053) is there when someone signed one: the owner's key, or a rehearsal's. Once the
          # key's certificate is committed a tag without it is refused here as well as in its own job.
          $apk = "BS3D-$env:BUILD_VERSION-android-arm64.apk"
          if (Test-Path "dist/$apk") { $files += $apk }
          elseif ('${{ github.ref_type }}' -eq 'tag' -and (Test-Path 'GameAndroid/release-certificate.sha256')) { throw "dist/$apk was not produced" }
          else { Write-Host "::notice::No Android package in this run." }
          $lines = foreach ($f in $files) { '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/$f").Hash.ToLowerInvariant(), $f }
          [System.IO.File]::WriteAllText("$PWD/dist/SHA256SUMS", (($lines -join "`n") + "`n"))
          Get-Content dist/SHA256SUMS
          # The same check a player runs, here, so the format is proven rather than assumed
          Push-Location dist
          sha256sum -c SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw "sha256sum -c refused the file it just wrote" }
          Pop-Location

      # The checksums stay with a manual run's artifacts, beside the packages above: the rehearsal is
      # downloaded and checked exactly as a release would be
      - name: Keep the checksums as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: BS3D-${{ env.BUILD_VERSION }}-SHA256SUMS
          path: dist/SHA256SUMS
          retention-days: 90

      # Only a tag publishes
      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @'
          ## Download and play

          ### Windows

          **Windows 10 or 11, 64-bit. Nothing to install** — the .NET runtime, MonoGame and everything else
          the game needs travel inside the zip. A DirectX 11 capable graphics card is all it asks of the
          machine.

          1. Download the `BS3D-...-win-x64.zip` below.
          2. Right-click the zip, choose Properties and tick **Unblock** (Windows marks everything
             downloaded), then extract it.
          3. Run `BS3D.exe` from the extracted folder.

          The exe is not code-signed — a signing certificate is the one part of this that costs money — so
          SmartScreen will say "Windows protected your PC" on the first launch: choose **More info**, then
          **Run anyway**.

          Progress and settings live in `%LOCALAPPDATA%\BS3D`, not in the game's folder, so the folder can be
          replaced or deleted without losing a save.

          ### Raspberry Pi 5 (Linux ARM64)

          `BS3D-...-linux-arm64.tar.gz` is the same game, from the same tag, for a Raspberry Pi 5 running 64-bit
          Raspberry Pi OS. It draws at one fixed graphics tier, **Potato** — a plainer picture than Windows'
          (@@PI_PICTURE@@) — and shows `ARM64` beside its version in the menu. Nothing to install: the .NET
          runtime, SDL2 and OpenAL travel inside it.

          1. Download the `BS3D-...-linux-arm64.tar.gz` below and extract it: `tar xzf BS3D-*-linux-arm64.tar.gz`
          2. From a desktop session, run it: `cd BS3D-*-linux-arm64 && ./BS3D`

          Progress and settings live in `~/.local/share/BS3D`, not in the game's folder.

          '@
          # The Android section (#1053), in a release that carries the APK and in no other
          $android = @'
          ### Android (phones and tablets, 64-bit ARM)

          `BS3D-...-android-arm64.apk` is the same game, from the same tag, for Android 7 or newer with OpenGL ES 3.0,
          played by touch or with a gamepad. It draws the Windows picture at a phone's settings (Low, Medium and High,
          and Potato for a weak phone), without supersampling, motion blur, the glass ceiling's refraction and the
          volumetric clouds, and shows `Android` beside its version in the menu.

          1. Download the `BS3D-...-android-arm64.apk` below on the phone and open it. It does not come from a store,
             so Android asks once to allow the browser or the file manager to install apps.
          2. Start **BS3D**.

          A phone may hold the game at 60 FPS until you allow it a high refresh rate in the phone's own display
          settings; Settings > SCREEN > FPS limit reads `60 Hz (phone setting)` while it does, and an update can
          switch it off again.

          Progress and settings live in the app's own storage, so uninstalling the app deletes them; installing a
          newer release over it keeps them.

          '@
          if (-not (Test-Path "dist/BS3D-$env:BUILD_VERSION-android-arm64.apk")) { $android = '' }
          $checksums = "``SHA256SUMS`` lists a checksum for every file below; check a download with ``sha256sum -c SHA256SUMS``."
          # What the Pi's picture lacks and keeps is stated once, in the website's data (#947): the page prints the
          # same words. PiPictureCopyTests refuses a hand-typed copy here and a placeholder that is gone.
          $piPicture = (Get-Content -Raw -Encoding utf8 'Web/src/_data/site.json' | ConvertFrom-Json).piPicture
          if (-not $piPicture) { throw "Web/src/_data/site.json has no piPicture for the Raspberry Pi section of the notes" }
          if (-not $notes.Contains('@@PI_PICTURE@@')) { throw "The release notes lost the @@PI_PICTURE@@ placeholder" }
          $notes = $notes.Replace('@@PI_PICTURE@@', $piPicture)
          $picture = ''
          foreach ($extension in 'jpg', 'png') {
            $path = "Images/releases/$env:BUILD_VERSION.$extension"
            if (Test-Path $path) {
              $picture = "![BS3D $env:BUILD_VERSION](https://raw.githubusercontent.com/${{ github.repository }}/$env:BUILD_VERSION/$path)`n`n"
              break
            }
          }
          if (-not $picture) { Write-Host "::notice::No Images/releases/$env:BUILD_VERSION.jpg (or .png) was committed, so the release notes carry no screenshot." }
          $written = ''
          $writtenPath = "Images/releases/$env:BUILD_VERSION.md"
          if (Test-Path $writtenPath) { $written = (Get-Content -Raw -Encoding utf8 $writtenPath).TrimEnd() + "`n`n" }
          else { Write-Host "::notice::No $writtenPath was committed, so the release notes carry no written section." }
          # The sections, a blank line between each: a here-string ends where its last line does
          $body = (@($notes.TrimEnd(), $android.TrimEnd(), $checksums) | Where-Object { $_ }) -join "`n`n"
          Set-Content -Path release-notes.md -Value ($picture + $written + $body) -Encoding utf8
          $assets = @("dist/BS3D-$env:BUILD_VERSION-win-x64.zip", "dist/BS3D-$env:BUILD_VERSION-linux-arm64.tar.gz")
          if ($android) { $assets += "dist/BS3D-$env:BUILD_VERSION-android-arm64.apk" }
          $assets += @("dist/BS3D-$env:BUILD_VERSION-ceilings.json", 'dist/SHA256SUMS')
          $releaseArgs = @('release', 'create', $env:BUILD_VERSION) + $assets +
            @('--title', "BS3D $env:BUILD_VERSION", '--notes-file', 'release-notes.md', '--generate-notes')
          # A tag carrying a suffix ("v0.2.0-beta") is a prerelease and GitHub should label it as one.
          if ($env:BUILD_VERSION -match '-') { $releaseArgs += '--prerelease' }
          gh @releaseArgs
